[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aaoifi-educational-kb"
version = "0.1.0"
description = "AAOIFI Shariah Standards knowledge base in simple English"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-NC-4.0" }
keywords = ["aaoifi", "islamic-finance", "shariah", "knowledge-base"]
authors = [{ name = "Iftikar" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aaoifi_kb = ["data/*.json"]
